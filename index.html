<script>
const items = JSON.parse(document.getElementById("notes").textContent);
const cues = JSON.parse(document.getElementById("cues").textContent);
const doc = document.getElementById("doc");
const playBtn = document.getElementById("play");
const prog = document.getElementById("prog");
const r1 = document.getElementById("r1");
const r2 = document.getElementById("r2");
const loopBtn = document.getElementById("loop");
const aud = document.getElementById("aud");
const blocks = [];
items.forEach((item, i) => {
  const el = document.createElement("p");
  el.className = "line";
  el.style.marginLeft = ((item.level || 0) * 18) + "px";
  (item.runs || []).forEach(r => {
    const mark = r.b || r.u || r.bg;
    if (!mark) {
      el.appendChild(document.createTextNode(r.t));
      return;
    }
    const s = document.createElement("span");
    s.textContent = r.t;
    if (r.u) s.classList.add("u");
    if (r.bg) {
      s.classList.add("hl");
      s.style.background = r.bg;
      if (r.b) s.style.fontWeight = "700";
    } else if (r.b) {
      s.classList.add("b");
    }
    el.appendChild(s);
  });
  (item.imgs || []).forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";
    el.appendChild(img);
  });
  el.addEventListener("click", () => jump(i));
  doc.appendChild(el);
  blocks.push(el);
});

const storeKey = "macro101b-mt2-idx";
const rateKey = "macro101b-mt2-rate";
const loopKey = "macro101b-mt2-loop";
let idx = Number(localStorage.getItem(storeKey) || 0);
if (!Number.isFinite(idx) || idx < 0 || idx >= items.length) idx = cues[0].i;
let playing = false;
let rate = Number(localStorage.getItem(rateKey) || 1);
if (rate !== 2) rate = 1;
let looping = localStorage.getItem(loopKey);
looping = looping === null ? true : looping === "1";
let lock = null;
let seekLock = null;

function center(el) {
  const header = document.querySelector("header");
  const footer = document.querySelector("footer");
  const topBar = header ? header.getBoundingClientRect().height : 0;
  const botBar = footer ? footer.getBoundingClientRect().height : 0;
  const rect = el.getBoundingClientRect();
  const mid = topBar + (window.innerHeight - topBar - botBar) / 2;
  const delta = rect.top + rect.height / 2 - mid;
  window.scrollBy(0, delta);
}
function mark() {
  blocks.forEach(el => el.classList.remove("on"));
  const el = blocks[idx];
  if (!el) return;
  el.classList.add("on");
  center(el);
  const n = cues.findIndex(c => c.i === idx);
  prog.textContent = (n >= 0 ? n + 1 : 1) + " / " + cues.length;
  localStorage.setItem(storeKey, String(idx));
}
function paintRate() {
  r1.classList.toggle("pick", rate === 1);
  r2.classList.toggle("pick", rate === 2);
  localStorage.setItem(rateKey, String(rate));
  aud.playbackRate = rate;
}
function paintLoop() {
  aud.loop = looping;
  loopBtn.setAttribute("aria-pressed", looping ? "true" : "false");
  loopBtn.textContent = looping ? "Looping" : "Loop";
  loopBtn.classList.toggle("pick", looping);
  localStorage.setItem(loopKey, looping ? "1" : "0");
}
function cueAt(time) {
  let k = 0;
  for (let i = 0; i < cues.length; i++) {
    if (time + 0.05 >= cues[i].start) k = i;
    else break;
  }
  return k;
}
function cueForItem(itemIndex) {
  for (let k = 0; k < cues.length; k++) {
    if (cues[k].i >= itemIndex) return k;
  }
  return cues.length - 1;
}
async function wake() {
  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function seekTo(start) {
  seekLock = start;
  const apply = () => {
    if (Math.abs((aud.currentTime || 0) - start) > 0.2) aud.currentTime = start;
  };
  if (aud.readyState >= 1) apply();
  else aud.addEventListener("loadedmetadata", apply, { once: true });
}
function session() {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: "Midterm 2", artist: "Macro 101B" });
  try {
    navigator.mediaSession.setActionHandler("play", () => play());
    navigator.mediaSession.setActionHandler("pause", () => pause());
  } catch (e) {}
}
function play() {
  if (Number.isFinite(aud.duration) && aud.currentTime >= aud.duration - 0.05) {
    idx = cues[0].i;
    seekTo(cues[0].start);
  }
  aud.playbackRate = rate;
  aud.loop = looping;
  playing = true;
  playBtn.textContent = "Pause";
  mark();
  wake();
  session();
  const p = aud.play();
  if (p && p.catch) p.catch(() => {
    playing = false;
    playBtn.textContent = "Play";
    document.getElementById("hint").textContent = "Tap Play again. If it is still silent, switch off the silent ringer and raise the volume.";
  });
}
function pause() {
  seekLock = null;
  playing = false;
  playBtn.textContent = "Play";
  aud.pause();
}
function jump(i) {
  const k = cueForItem(i);
  idx = cues[k].i;
  mark();
  const start = cues[k].start;
  aud.playbackRate = rate;
  aud.loop = looping;
  playing = true;
  playBtn.textContent = "Pause";
  wake();
  session();
  const p = aud.play();
  seekTo(start);
  aud.addEventListener("playing", () => {
    if (seekLock === start && Math.abs(aud.currentTime - start) > 0.25) aud.currentTime = start;
  }, { once: true });
  if (p && p.catch) p.catch(() => {
    playing = false;
    playBtn.textContent = "Play";
  });
}
playBtn.addEventListener("click", () => { if (playing) pause(); else play(); });
function setRate(n) {
  rate = n;
  paintRate();
}
r1.addEventListener("click", () => setRate(1));
r2.addEventListener("click", () => setRate(2));
loopBtn.addEventListener("click", () => { looping = !looping; paintLoop(); });
aud.addEventListener("timeupdate", () => {
  if (seekLock != null) {
    if (Math.abs(aud.currentTime - seekLock) > 0.35) return;
    seekLock = null;
  }
  const k = cueAt(aud.currentTime);
  if (cues[k].i !== idx) { idx = cues[k].i; mark(); }
});
aud.addEventListener("seeked", () => {
  if (seekLock == null) return;
  if (Math.abs(aud.currentTime - seekLock) > 0.35) {
    aud.currentTime = seekLock;
    return;
  }
  seekLock = null;
  idx = cues[cueAt(aud.currentTime)].i;
  mark();
});
aud.addEventListener("ended", () => {
  if (looping) return;
  playing = false;
  playBtn.textContent = "Play";
  idx = cues[0].i;
  mark();
});
aud.addEventListener("play", () => { playing = true; playBtn.textContent = "Pause"; });
aud.addEventListener("pause", () => {
  if (seekLock != null) return;
  if (!aud.ended) { playing = false; playBtn.textContent = "Play"; }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && playing) wake();
});
paintRate();
paintLoop();
mark();
document.getElementById("hint").textContent = "Open this in Safari. It loops, so you can leave it on while you sleep. Switch the silent ringer off. Tap a line to jump there. The box follows the voice. 1× and 2× set the speed. Green is what you bolded. Other colors are your highlights. Indent follows the doc. Equation pictures stay on the page and are not read aloud.";
</script>
